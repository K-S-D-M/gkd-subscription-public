# ============================================
# GKD 触发后的动作序列（物流APP半自动流程）
# 修改后保存即可生效（脚本每次触发时自动重新读取）
# ============================================

# ====== 第1步：打开时钟 55 分钟倒计时 ======
am start -n com.android.deskclock/.DeskClockTabActivity
sleep 2
# 切到计时Tab（若已在计时页则无影响）
input tap 1061 2564
sleep 1
# 点击开始倒计时（55分已默认记忆）
input tap 609 2275
sleep 1

# ====== 第2步：打开微信并进入中邮群 ======
am start -n com.tencent.mm/.ui.LauncherUI
sleep 4
# 点击聊天列表中的「中邮-封签拍照反馈」群（位置固定在第3条，若变化需校准）
input tap 628 561
sleep 3

# ====== 第3步：发送照片到群聊 ======
# 点击更多功能按钮(+)
input tap 1147 2579
sleep 2
# 点击相册
input tap 189 2025
sleep 2
# 勾选最新水印照片1
input tap 1141 952
sleep 1
# 勾选最新水印照片2
input tap 231 1256
sleep 1
# 点击发送
input tap 1053 2578
sleep 3

# ====== 第4步：回到物流APP并点击导航 ======
am start -n com.xunmeng.tms/.activity.FlutterMainActivity
sleep 3
# 点击导航按钮
input tap 201 769
sleep 2
# 地图选择框中选择高德地图
input tap 610 2397
sleep 4
# 点击开始导航
input tap 1000 2542

# ====== 说明 ======
# 拍照步骤由用户手动完成（水印相机拍指定位置）
# 坐标基于 1220x2712 分辨率，微信列表位置/版本改版需重新校准
# 本动作文件供有root/可执行adb的监听环境使用；无root设备仅使用GKD订阅中的点击规则