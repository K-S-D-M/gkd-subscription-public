# ============================================
# GKD 触发后的动作序列（每行一条命令，依次执行）
# 修改后保存即可生效（脚本每次触发时自动重新读取）
#
# 支持的命令示例：
#   am start -n 包名/.Activity     启动应用
#   input tap X Y                点击坐标
#   input swipe X1 Y1 X2 Y2      滑动
#   input text 内容              输入文本
#   sleep 1                      等待（秒）
#   # 开头的是注释
#
# 本文件是【物流APP半自动流程】动作模板，按实际流程修改
# ============================================

# ====== 第1步：打开时钟 55 分钟倒计时 ======
# 时钟 APP 默认停在计时页，直接拉起即可
am start -n com.android.deskclock/.DeskClockTabActivity
sleep 2
# 点击“开始倒计时”按钮（55分钟已默认）
input tap 610 2275
sleep 1

# ====== 第2步：打开微信并进入群聊 ======
# 微信主界面 -> 进入目标群聊（需要坐标/ID，按实际调整）
