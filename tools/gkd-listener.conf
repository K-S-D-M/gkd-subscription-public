# ============================================
# GKD 联动监听 - 配置文件
# 修改后保存即可生效（脚本每次触发时自动重新读取）
# ============================================

# 触发关键词（GKD 规则组 name 的关键词，多个用 | 分隔，必须加引号）
TRIGGER_KEYWORDS="点击出仓库|导航按钮出现（标记）|进入中邮封签拍照反馈群（标记）"

# 启用时间段（24小时制，-1 表示不限制）
# 例：晚上 7-9 点执行：START_HOUR=19  END_HOUR=21
START_HOUR=19
END_HOUR=21

# 目标应用包名（默认拉起）
TARGET_PKG=com.xunmeng.tms

# GKD 日志目录
LOG_DIR=/sdcard/Android/data/li.songe.gkd/files/log

# 监听脚本自身日志
SELF_LOG=/sdcard/Download/gkd-listener.log

# 防重复触发时间窗（秒）
DEDUP_SEC=60

# 轮询间隔（秒）
POLL_INTERVAL=0.5

# 触发后要执行的命令序列文件（每行一条命令，支持 # 注释）
ACTIONS_FILE=/sdcard/Download/gkd-listener-actions.conf

# ===== 水印照片检测（拍照完成触发） =====
# 水印照片目录（拍照完成后新增照片，触发流程）
PHOTO_DIR="/sdcard/DCIM/pddtms/多多买菜水印相机"
# 照片匹配正则（注意：grep 正则，* 前需转义为 .*）
PHOTO_PATTERN=water_.*\.jpg
# 检测到新增照片后的防重触发秒数（与 DEDUP_SEC 同理）
PHOTO_DEDUP_SEC=300